<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1329" />
    <meta name="color-scheme" content="dark light" />
    
    <title>Cantor Cristão — Hinário Oficial</title>
    <meta name="description" content="Hinário Cantor Cristão completo com 581 hinos tradicionais para cultos e devoção. Rápido, 100% offline e sem anúncios." />
    
    <!-- PWA Web App Manifest (Mandatory for installation) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cantor Cristão" />
    <meta name="application-name" content="Cantor Cristão" />
    
    <!-- Icons & Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png" />
  </head>
  <body>
    <div id="app"></div>
    
    <!-- Register PWA Service Worker Directly -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('Cantor Cristão: Service Worker ativo no escopo:', reg.scope);
            })
            .catch(function(err) {
              console.warn('Cantor Cristão: Falha ao registrar Service Worker:', err);
            });
        });
      }
    </script>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
