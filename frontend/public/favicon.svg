<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Royal Navy Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e2e5c" />
      <stop offset="60%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>

    <!-- Exquisite Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="35%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="40%" stop-color="#D97706" />
      <stop offset="80%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background Base with Rounded App Icon Corners -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Outer Elegant Gold Border -->
  <rect x="18" y="18" width="476" height="476" rx="100" fill="none" stroke="url(#goldLight)" stroke-width="3" opacity="0.4" />
  
  <!-- Subtle Inner Circular Halo -->
  <circle cx="256" cy="246" r="190" fill="url(#glowGrad)" />
  <circle cx="256" cy="246" r="186" fill="none" stroke="url(#goldLight)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.3" />

  <!-- MAIN ARTWORK WITH DROP SHADOW -->
  <g filter="url(#dropShadow)">
    
    <!-- 1. The Radiant Cross at the Zenith -->
    <g filter="url(#softGlow)" transform="translate(256, 76)">
      <!-- Vertical beam -->
      <rect x="-6" y="0" width="12" height="58" rx="3" fill="url(#goldLight)" />
      <!-- Horizontal beam -->
      <rect x="-24" y="14" width="48" height="11" rx="3" fill="url(#goldLight)" />
      <!-- Little golden halo ring behind cross -->
      <circle cx="0" cy="19" r="18" fill="none" stroke="url(#goldDark)" stroke-width="2.5" opacity="0.8" />
    </g>

    <!-- 2. The Sacred Davidic Harp / Lyre Frame -->
    <!-- Left Arm -->
    <path d="M 230 148 C 170 148 112 195 118 270 C 122 315 152 352 190 372 L 202 344 C 172 328 148 298 144 266 C 140 216 178 178 226 176 Z" fill="url(#goldLight)" />
    <!-- Right Arm -->
    <path d="M 282 148 C 342 148 400 195 394 270 C 390 315 360 352 322 372 L 310 344 C 340 328 364 298 368 266 C 372 216 334 178 286 176 Z" fill="url(#goldDark)" />

    <!-- Top Arch Crossbar -->
    <path d="M 218 152 C 240 146 272 146 294 152 L 298 170 C 274 164 238 164 214 170 Z" fill="url(#goldLight)" />

    <!-- Harp Strings (Fine Golden Light) -->
    <g stroke="url(#goldLight)" stroke-width="2.2" opacity="0.85">
      <line x1="222" y1="168" x2="222" y2="352" />
      <line x1="239" y1="164" x2="239" y2="356" />
      <line x1="256" y1="162" x2="256" y2="358" />
      <line x1="273" y1="164" x2="273" y2="356" />
      <line x1="290" y1="168" x2="290" y2="352" />
    </g>

    <!-- 3. The Open Sacred Hymnal Book at the Base -->
    <g transform="translate(0, 20)">
      <!-- Left Page Shadow/Backing -->
      <path d="M 256 362 C 205 348 142 355 96 376 L 96 322 C 142 301 205 308 256 322 Z" fill="#D97706" opacity="0.7" />
      <!-- Right Page Shadow/Backing -->
      <path d="M 256 362 C 307 348 370 355 416 376 L 416 322 C 370 301 307 308 256 322 Z" fill="#92400E" opacity="0.7" />

      <!-- Left Page White/Ivory Surface -->
      <path d="M 256 354 C 205 340 142 346 102 368 L 102 312 C 142 291 205 298 256 312 Z" fill="#FFFFFF" />
      <!-- Right Page White/Ivory Surface -->
      <path d="M 256 354 C 307 340 370 346 410 368 L 410 312 C 370 291 307 298 256 312 Z" fill="#F8FAFC" />

      <!-- Golden Page Edges & Center Rib -->
      <path d="M 256 312 L 256 356" stroke="url(#goldLight)" stroke-width="4" stroke-linecap="round" />
      <path d="M 102 312 C 142 291 205 298 256 312 C 307 298 370 291 410 312" fill="none" stroke="url(#goldLight)" stroke-width="3" />
      <path d="M 102 368 C 142 346 205 340 256 354 C 307 340 370 346 410 368" fill="none" stroke="url(#goldDark)" stroke-width="3" />

      <!-- Musical Notes on Pages -->
      <!-- Left Page notes -->
      <circle cx="155" cy="330" r="4.5" fill="#1E293B" />
      <rect x="158" y="316" width="2" height="14" fill="#1E293B" />
      <circle cx="195" cy="326" r="4.5" fill="#1E293B" />
      <rect x="198" y="312" width="2" height="14" fill="#1E293B" />
      <polygon points="160,316 200,312 200,315 160,319" fill="#1E293B" />

      <!-- Right Page notes -->
      <circle cx="315" cy="326" r="4.5" fill="#1E293B" />
      <rect x="318" y="312" width="2" height="14" fill="#1E293B" />
      <circle cx="355" cy="330" r="4.5" fill="#1E293B" />
      <rect x="358" y="316" width="2" height="14" fill="#1E293B" />
      <polygon points="320,312 360,316 360,319 320,315" fill="#1E293B" />
    </g>

    <!-- Little Golden Star Flashes -->
    <polygon points="256,66 258,74 266,76 258,78 256,86 254,78 246,76 254,74" fill="#FFFFFF" />
    <polygon points="124,198 125,203 130,204 125,205 124,210 123,205 118,204 123,203" fill="#FDE68A" />
    <polygon points="388,198 389,203 394,204 389,205 388,210 387,205 382,204 387,203" fill="#FDE68A" />
  </g>

  <!-- Typography at the Foot: "CANTOR CRISTÃO" -->
  <text x="256" y="446" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="28" font-weight="bold" letter-spacing="6" fill="url(#goldLight)" filter="url(#dropShadow)">
    CANTOR CRISTÃO
  </text>
  <text x="256" y="472" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#94A3B8" opacity="0.8">
    HINÁRIO OFICIAL
  </text>
</svg>
