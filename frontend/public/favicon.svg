<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Outer Rim -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Open Hymnal Book Silhouette -->
  <g filter="url(#shadow)" transform="translate(64, 110)">
    <!-- Book Left Page -->
    <path d="M 192 250 C 120 230 40 240 10 255 L 10 70 C 40 55 120 45 192 65 Z" fill="#ffffff" opacity="0.95" />
    <!-- Book Right Page -->
    <path d="M 192 250 C 264 230 344 240 374 255 L 374 70 C 344 55 264 45 192 65 Z" fill="#ffffff" opacity="0.9" />
    <!-- Book Center Spine -->
    <line x1="192" y1="65" x2="192" y2="250" stroke="#cbd5e1" stroke-width="4" />
    
    <!-- Musical Staff lines subtle -->
    <line x1="35" y1="110" x2="165" y2="110" stroke="#94a3b8" stroke-width="2" opacity="0.6" />
    <line x1="35" y1="130" x2="165" y2="130" stroke="#94a3b8" stroke-width="2" opacity="0.6" />
    <line x1="35" y1="150" x2="165" y2="150" stroke="#94a3b8" stroke-width="2" opacity="0.6" />
    
    <line x1="219" y1="110" x2="349" y2="110" stroke="#94a3b8" stroke-width="2" opacity="0.6" />
    <line x1="219" y1="130" x2="349" y2="130" stroke="#94a3b8" stroke-width="2" opacity="0.6" />
    <line x1="219" y1="150" x2="349" y2="150" stroke="#94a3b8" stroke-width="2" opacity="0.6" />

    <!-- Musical Note & Cross Symbol in Center Gold -->
    <g transform="translate(142, 10)">
      <!-- Golden Cross Silhouette -->
      <path d="M 45 0 L 55 0 L 55 25 L 80 25 L 80 35 L 55 35 L 55 100 L 45 100 L 45 35 L 20 35 L 20 25 L 45 25 Z" fill="url(#goldGrad)" filter="url(#shadow)" />
      <!-- Musical Treble Clef / Note motif -->
      <circle cx="85" cy="85" r="14" fill="url(#goldGrad)" />
      <rect x="94" y="30" width="5" height="55" fill="url(#goldGrad)" />
      <polygon points="99,30 115,35 115,48 99,42" fill="url(#goldGrad)" />
    </g>
  </g>
</svg>
